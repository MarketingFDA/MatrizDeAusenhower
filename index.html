<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="robots" content="noindex, nofollow" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F4F7F9" />
  <meta name="description" content="Matriz de Eisenhower Fradema — organize as tarefas do time nos quadrantes Fazer Agora, Agendar, Delegar e Eliminar, com múltiplos quadros." />
  <title>Matriz de Eisenhower — Fradema</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Camadas de fundo "liquid glass" (gradientes animados atrás do vidro) -->
  <div class="bg-field" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="blob blob--cyan"></div>
    <div class="blob blob--magenta"></div>
    <div class="blob blob--red"></div>
    <div class="bg-vignette"></div>
  </div>

  <div id="root"></div>

  <noscript>
    <p style="color:#0A192F;text-align:center;padding:2rem;font-family:sans-serif">
      Esta aplicação precisa de JavaScript habilitado.
    </p>
  </noscript>

  <!-- Configuração da sincronização compartilhada (precisa vir ANTES do app.jsx).
       Com a url vazia, o app roda 100% local no navegador, como antes. -->
  <script src="sync-config.js"></script>

  <!-- React + Babel via CDN (sem build step, ideal para GitHub Pages) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
